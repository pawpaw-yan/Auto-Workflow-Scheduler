name: oracle-abc

# ═══════════════════════════════════════════════════════════════════════
# 项目：oracle-abc
#
# 对应代码：python/oracle-abc/index.py
# 对应环境：python_oracle_abc
#
# 功能：抢占 OCI Ampere A1 实例（1 OCPU / 6 GB），
#       抢到后停止并升级为 2 OCPU / 12 GB；若已抢到则直接升级。
#
# 触发方式：
#   1) 总入口派发：run-project.yml 传 project=oracle-abc（⚠️ 总入口不能再传参数）
#   2) 直接调用 API：
#      POST /repos/<owner>/<repo>/actions/workflows/oracle-abc.yml/dispatches
#      {"ref":"main","inputs":{"TARGET_OCPUS":"4"}}
#   3) Actions 页面手动 Run workflow —— 每个可覆盖项都是一个独立输入框
#
# 典型用法：由外部调度器（cron-job.org 等）每 5 分钟触发一次，
#          因为 A1 常年缺货，"没抢到"是预期内结果，脚本会正常退出 0。
#
# 配置来源优先级（高 → 低）：
#     ref（同名 input）  >  vars / secrets（本文件的 env:）  >  <项目目录>/.env
# 前两层都在下面的 env: 里完成，每个键一行：
#     KEY: ${{ inputs.KEY || vars.KEY }}        # 机密项写 secrets.KEY
# 空字符串视为「没传」，所以留空会自动回落到仓库配置。
#
# ✅ **input 的名字 = 进程里的变量名**，所以以前那个「该写 TARGET 还是 TARGET_OCPUS」
#    的坑没有了 —— 输入框叫什么，变量就叫什么，也对得上 SECRET_NAMES / VARIABLE_NAMES。
#
# .env 是最低优先级，由 Python 侧在运行期读取（python/common/dotenv.py），不在 workflow 里体现。
#
# 通用逻辑全部在 common/*.sh，本文件只做「声明」：
#   common/report-inputs.sh  ref 层：报告本次传了哪些项 + 机密项告警（没传则跳过）
# ═══════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    # 每个可覆盖项一个输入框，留空 = 用仓库里配的 vars / secrets。
    # ⚠️ input 不是机密：传了就等于公开（公开仓库的 run 详情页人人可见）。
    #
    # 这里只列出**日常会临时调的**几个。其余 OCI_* 标识符也想用 ref 传的话，照着格式
    # 加一个同名 input 即可（名字必须等于进程里的变量名），再在 env: 里接上 `||`。
    # ⚠️ OCI_CLI_KEY_CONTENT（私钥）**故意不开放 ref 传参** —— 它只该放 secret。
    inputs:
      GRAB_OCPUS:
        description: '抢占时申请的 OCPU 数，越小越容易抢到（留空 = 用仓库配置）'
        required: false
        default: ''
        type: string
      GRAB_MEMORY_GB:
        description: '抢占时申请的内存 GB（留空 = 用仓库配置）'
        required: false
        default: ''
        type: string
      TARGET_OCPUS:
        description: '升级的最终目标 OCPU 数（留空 = 用仓库配置）'
        required: false
        default: ''
        type: string
      OCI_AVAILABILITY_DOMAIN:
        description: '可用域（留空 = 用仓库配置）'
        required: false
        default: ''
        type: string
      OCI_INSTANCE_NAME:
        description: '实例显示名，脚本按它查找/创建（留空 = 用仓库配置）'
        required: false
        default: ''
        type: string

concurrency:
  group: oracle-abc
  cancel-in-progress: false

jobs:
  run:
    name: oracle-abc
    runs-on: ubuntu-latest
    environment:
      name: python_oracle_abc
    permissions:
      contents: read
    env:
      # ── 传给 common/*.sh 的通用参数 ──
      ENV_NAME:  python_oracle_abc
      LANG_NAME: python
      PROJECT:   oracle-abc
      ENTRY:     python/oracle-abc/index.py

      # ─────────────────────────────────────────────────────────────
      # OCI 认证。index.py 直接读这些环境变量拼成 SDK config，无需 ~/.oci/config：
      #   OCI_CLI_USER / OCI_CLI_FINGERPRINT / OCI_CLI_TENANCY / OCI_CLI_REGION
      #   OCI_CLI_KEY_CONTENT（私钥内容）或 OCI_CLI_KEY_FILE（私钥路径）
      #
      # ⚠️ 只有私钥内容是真凭据，必须放 secret。
      #    其余都是 OCID / 标识符，单独泄露无法用于认证，放 Variables
      #    的好处是日志里明文可见，排查配置错漏时非常直观。
      # ─────────────────────────────────────────────────────────────
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}

      # 如果私钥带口令加密，需要额外提供（默认注释掉：空的
      # OCI_CLI_PASSPHRASE 可能干扰未加密私钥的解析）。
      # OCI_CLI_PASSPHRASE: ${{ secrets.OCI_CLI_PASSPHRASE }}

      OCI_CLI_USER:             ${{ vars.OCI_CLI_USER }}
      OCI_CLI_FINGERPRINT:      ${{ vars.OCI_CLI_FINGERPRINT }}
      OCI_CLI_TENANCY:          ${{ vars.OCI_CLI_TENANCY }}
      OCI_CLI_REGION:           ${{ vars.OCI_CLI_REGION }}
      OCI_COMPARTMENT_ID:       ${{ vars.OCI_COMPARTMENT_ID }}
      OCI_AVAILABILITY_DOMAIN:  ${{ inputs.OCI_AVAILABILITY_DOMAIN || vars.OCI_AVAILABILITY_DOMAIN }}
      OCI_SUBNET_ID:            ${{ vars.OCI_SUBNET_ID }}
      OCI_IMAGE_ID:             ${{ vars.OCI_IMAGE_ID }}
      OCI_INSTANCE_NAME:        ${{ inputs.OCI_INSTANCE_NAME || vars.OCI_INSTANCE_NAME }}
      # SSH 公钥：必填。创建实例时注入，不填则实例建出来无法登录。
      # 公钥本身不是机密，放 Variables；但请务必确认粘的是 .pub 文件内容，
      # 代码会拦截「误把私钥粘进来」的情况。
      OCI_SSH_PUBLIC_KEY:       ${{ vars.OCI_SSH_PUBLIC_KEY }}

      # ─────────────────────────────────────────────────────────────
      # 抢占与升级参数。对应 GitHub 上的三个 Environment variables：
      #   OCPU    抢占时申请的 OCPU 数（越小越容易抢到）
      #   MEMORY  抢占时申请的内存（GB）
      #   TARGET  升级的最终目标 OCPU 数
      #
      # 例：OCPU=1  MEMORY=6  TARGET=4
      #   → 抢 1c6g，然后分步升级 2c12g → 4c24g（跳过 3c18g）
      #   → 每轮升完都重新判断，达到 TARGET 才结束
      #   → 每轮放大倍数由 STEP_FACTOR 控制，默认 ×2
      #
      # 留空则用脚本内默认值（抢 1c6g、目标 2c）
      # ─────────────────────────────────────────────────────────────
      # ⚠️ 左边为空（没传参）就取右边。输入框的名字是 GRAB_OCPUS / GRAB_MEMORY_GB /
      #    TARGET_OCPUS（进程里的变量名），不是 GitHub Variable 名（OCPU / MEMORY / TARGET）。
      GRAB_OCPUS:     ${{ inputs.GRAB_OCPUS || vars.OCPU }}
      GRAB_MEMORY_GB: ${{ inputs.GRAB_MEMORY_GB || vars.MEMORY }}
      TARGET_OCPUS:   ${{ inputs.TARGET_OCPUS || vars.TARGET }}

      # ── 本次 ref 传了哪些项 ──
      #    只给 common/report-inputs.sh 用：报告名称 + 长度、给机密项打 ::warning::。
      #    它读**原始 inputs**，而不是上面回落后的值 —— 否则分不清「传了」和「没传」。
      REF_INPUTS:     ${{ toJSON(inputs) }}

      # 可选：每轮放大倍数，默认 2（翻倍：1c→2c→4c）。设为 1 则逐级 +1
      # STEP_FACTOR:     ${{ vars.STEP_FACTOR }}

      # 可选：每个 OCPU 配多少内存 GB。不设则沿用 MEMORY / OCPU 的比例
      # MEMORY_PER_OCPU: ${{ vars.MEMORY_PER_OCPU }}

      # ── 指纹密钥：仓库级 secret，只供 check-secrets.sh 生成 HMAC 指纹，本身绝不打印 ──
      #    （此前本项目漏了这行，导致指纹列一直显示 (skip: no key)）
      COMMON_FINGERPRINT_KEY: ${{ secrets.COMMON_FINGERPRINT_KEY }}

      # ── 配置自检的调试开关（两级，Environment 覆盖仓库级）──
      # 默认【整体跳过】自检；只有这里为真值时才执行，并输出明文便于排查。
      #   DEBUG_MODE          当前 Environment 的开关：只调试本项目时设它
      #   COMMON_DEBUG_MODE   仓库级全局开关：所有项目一起打开
      # 未设置 → 展开为空字符串 → 脚本按「回落到另一级 / 跳过」处理。
      # ⚠️ 这两行必须存在：脚本只认进程环境变量，GitHub 上的 Variables 靠这两行桥接，
      #    漏了就会出现「在 GitHub 设了开关但没生效」。
      DEBUG_MODE:        ${{ vars.DEBUG_MODE }}
      COMMON_DEBUG_MODE: ${{ vars.COMMON_DEBUG_MODE }}

      # 自检项名称（仅在调试开关开启时才会被读取与输出）：
      #   secrets    → 只输出 HMAC 指纹，永不打印明文
      #   variables  → 输出明文值
      # ⚠️ 必须写**进程里真实存在的变量名**：OCPU / MEMORY / TARGET 只是 GitHub Variable
      #    的显示名，上面已被映射成 GRAB_OCPUS / GRAB_MEMORY_GB / TARGET_OCPUS。
      #    写成原名的话自检表永远显示空。
      # SECRET_NAMES 同时给 report-inputs.sh 用：在里面且被 ref 传入的项会打 ::warning::
      SECRET_NAMES:   "OCI_CLI_KEY_CONTENT"
      VARIABLE_NAMES: "OCI_CLI_USER OCI_CLI_FINGERPRINT OCI_CLI_TENANCY OCI_CLI_REGION OCI_COMPARTMENT_ID OCI_AVAILABILITY_DOMAIN OCI_SUBNET_ID OCI_IMAGE_ID OCI_INSTANCE_NAME OCI_SSH_PUBLIC_KEY GRAB_OCPUS GRAB_MEMORY_GB TARGET_OCPUS"

    steps:
      - uses: actions/checkout@v4

      # 报告本次通过 ref 传了哪些项（只列名称和长度）、给机密项打 ::warning::。
      # 注意：**值的生效不靠这一步** —— 靠上面 env: 里的 `inputs.X || vars.X`。
      - name: Report ref inputs
        run: bash common/report-inputs.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # OCI Python SDK（oci）已作为项目依赖写在 python/oracle-abc/requirements.txt，
      # 由 common/install-deps.sh 统一安装，不再需要单独装 oci-cli
      - name: Install dependencies
        run: bash common/install-deps.sh

      - name: Check secrets
        run: bash common/check-secrets.sh

      - name: Run
        run: bash common/execute.sh

      # 把 Run 的输出重新渲染到 Job Summary。
      # if: always()：即使 Run 失败，也要把已产生的输出带出来
      - name: Job Summary
        if: always()
        env:
          SUMMARY_TITLE: oracle-abc
        run: bash common/render-summary.sh
