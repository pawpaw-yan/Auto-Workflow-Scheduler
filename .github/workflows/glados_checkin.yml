name: glados_checkin

# ═══════════════════════════════════════════════════════════════════════
# 项目：glados_checkin
#
# 对应代码：python/glados_checkin/index.py
# 对应环境：python_glados_checkin
#
# 触发方式：
#   1) 总入口派发：run-project.yml 传 project=glados_checkin
#   2) 直接调用 API：
#      POST /repos/<owner>/<repo>/actions/workflows/glados_checkin.yml/dispatches
#      {"ref":"main"}
#   3) Actions 页面手动 Run workflow
#
# 通用逻辑全部在 common/*.sh，本文件只做「声明」：
#   common/install-deps.sh    依赖安装（按 LANG_NAME 分支）
#   common/check-secrets.sh   secrets 自检（位数 + HMAC 指纹）
#   common/execute.sh         按 ENTRY 扩展名执行
#
# 新增同类项目：复制本文件，改 name / environment.name / env / ENTRY 四处。
# ═══════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:

concurrency:
  group: glados_checkin
  cancel-in-progress: false

jobs:
  run:
    name: glados_checkin
    runs-on: ubuntu-latest
    # 挂到本项目专属的 Environment，secrets 与其他项目隔离
    environment:
      name: python_glados_checkin
    permissions:
      contents: read
    env:
      # ── 传给 common/*.sh 的通用参数 ──
      ENV_NAME:  python_glados_checkin
      LANG_NAME: python
      PROJECT:   glados_checkin
      ENTRY:     python/glados_checkin/index.py

      # ── 敏感值 → Environment secrets，用 secrets.* 引用 ──
      GLADOS_COOKIES:         ${{ secrets.GLADOS_COOKIES }}
      PUSHDEER_SENDKEY:       ${{ secrets.PUSHDEER_SENDKEY }}

      # ── 非敏感配置 → Environment variables，用 vars.* 引用 ──
      #    写错来源（该用 vars 却写了 secrets）会静默解析成空字符串，
      #    代码里有默认值兜底，所以不会报错但配置不生效。
      GLADOS_EXCHANGE_PLAN:   ${{ vars.GLADOS_EXCHANGE_PLAN }}
      GLADOS_VERBOSE:         ${{ vars.GLADOS_VERBOSE }}

      # ── 指纹密钥：仓库级 secret，只供 check-secrets.sh 生成 HMAC 指纹，本身绝不打印 ──
      COMMON_FINGERPRINT_KEY: ${{ secrets.COMMON_FINGERPRINT_KEY }}

      # 需要自检的名称，空格分隔。
      #   SECRET_NAMES   → 只输出 HMAC 指纹（值不可见）
      #   VARIABLE_NAMES → 直接输出明文值（方便直接确认配置）
      SECRET_NAMES:   "GLADOS_COOKIES PUSHDEER_SENDKEY"
      VARIABLE_NAMES: "GLADOS_EXCHANGE_PLAN GLADOS_VERBOSE"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: bash common/install-deps.sh

      - name: Check secrets
        run: bash common/check-secrets.sh

      - name: Run
        run: bash common/execute.sh

      # 把 Run 的输出重新渲染到 Job Summary。
      # if: always()：即使 Run 失败，也要把已产生的输出带出来
      - name: Job Summary
        if: always()
        env:
          SUMMARY_TITLE: GLaDOS 签到
        run: bash common/render-summary.sh
