name: Run Project

# 总入口：把参数解析成项目 workflow，再派发到它。不做任何具体任务。
#
# 约定：.github/workflows/ 下**不以 run- 开头**的 .yml 即项目，
#       文件名（去扩展名）即项目名。run- 前缀保留给基础设施。
#       secrets / Environment 一律由各项目 workflow 自己挂载。
#
# 外部触发：
#   POST /repos/<owner>/<repo>/actions/workflows/run-project.yml/dispatches
#   {"ref":"main","inputs":{"project":"glados_checkin"}}
#
# ⚠️ 总入口**只负责选项目**，不传配置参数 —— 各项目的配置项是各自的 workflow_dispatch
#    input，总入口没法知道它们叫什么。要临时改配置，请直接派发对应项目的 workflow
#    （Actions 页面上，每个配置项会是一个独立输入框）。
#
# 为什么用派发而不是 uses: 直接调用：
#   jobs.<job_id>.uses 不支持表达式，无法动态选择被调用的 workflow 文件。

on:
  workflow_dispatch:
    inputs:
      project:
        description: '项目名，如 glados_checkin'
        required: true
        type: string
      ref:
        description: '分支或标签，留空 = 当前分支'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: write   # 派发其他 workflow 所必需

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # workflow_dispatch 是「GITHUB_TOKEN 不触发新 run」的例外
          PROJECT_RAW: ${{ inputs.project }}
          REF_INPUT: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          hdr=(-H "Authorization: Bearer ${GH_TOKEN}"
               -H "Accept: application/vnd.github+json"
               -H "X-GitHub-Api-Version: 2026-03-10")
          ref="${REF_INPUT:-${GITHUB_REF_NAME}}"

          # 归一化：glados-checkin / GLADOS_CHECKIN / glados_checkin.yml -> glados_checkin
          norm() { printf '%s' "$1" | tr 'A-Z' 'a-z' | sed -E 's/[^a-z0-9]+/_/g; s/^_+//; s/_+$//'; }
          want=$(norm "${PROJECT_RAW%.yml}")

          # 可用项目 = 仓库已注册的 workflow 中，文件名不以 run- 开头的
          paths=$(curl -s "${hdr[@]}" "${api}/actions/workflows?per_page=100" | jq -r '.workflows[].path')
          if [ -z "$paths" ]; then
            echo "::error::无法读取 workflow 列表，请确认 job 上有 permissions: actions: write"
            exit 1
          fi

          matched=""; available=""
          while read -r path; do
            [ -n "$path" ] || continue
            file="${path##*/}"
            case "$file" in run-*) continue ;; esac
            stem="${file%.yml}"; stem="${stem%.yaml}"
            available="${available}${available:+, }${stem}"
            if [ "$(norm "$stem")" = "$want" ]; then matched="$file"; fi
          done <<< "$paths"

          if [ -z "$matched" ]; then
            echo "::error::未找到项目 '$PROJECT_RAW'。可用项目：${available:-（无）}"
            exit 1
          fi
          echo "→ $PROJECT_RAW ⇒ $matched (ref=$ref)"

          # 派发。用 jq 构造 payload（ref 可能含引号），不手工拼 JSON。
          # ⚠️ 故意**不带 inputs** —— 总入口不传配置参数，原因见文件头。
          payload=$(jq -n --arg ref "$ref" '{ref: $ref, return_run_details: true}')

          code=$(curl -s -o resp.json -w '%{http_code}' -X POST "${hdr[@]}" \
                   -H "Content-Type: application/json" \
                   "${api}/actions/workflows/${matched}/dispatches" \
                   -d "$payload")

          if [ "$code" != "200" ] && [ "$code" != "204" ]; then
            echo "::error::派发失败（HTTP $code）"
            cat resp.json
            exit 1
          fi

          run_url=$(jq -r '.html_url // empty' resp.json 2>/dev/null || true)
          echo "已派发 ${matched}"
          if [ -n "$run_url" ]; then echo "运行地址: $run_url"; fi

          {
            echo "## 已派发 \`${matched}\`"
            echo ""
            echo "ref: \`${ref}\` · HTTP ${code}"
            if [ -n "$run_url" ]; then
              echo ""
              echo "运行地址：${run_url}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
