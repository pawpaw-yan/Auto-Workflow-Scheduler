name: Hello Cron

on:
  # 每 15 分钟执行一次，但整体错开整点：每小时的 7、22、37、52 分
  # 原因：GitHub 官方文档指出「每个整点前后」是 Actions 负载最高的时段，
  #       高频任务在该窗口容易被延迟甚至丢弃，故偏移 7 分钟避开
  # 注意：GitHub cron 使用 UTC 时间。北京时间 = UTC+8，整点偏移不改变分钟位，
  #       所以该表达式在 UTC 和北京时间下都是每小时的 7/22/37/52 分
  schedule:
    - cron: "7,22,37,52 * * * *"
  # 允许在 Actions 页面手动触发，方便调试
  workflow_dispatch:

# 同一时间只保留一个运行中的任务，避免排队堆积
concurrency:
  group: hello-cron
  cancel-in-progress: false

jobs:
  hello:
    name: Echo Hello Cron
    runs-on: ubuntu-latest
    # 默认权限最小化，按需在具体步骤中提升
    permissions:
      contents: read
    steps:
      - name: Run echo
        run: echo "Hello Cron!"
