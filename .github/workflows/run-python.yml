name: Run Projects

# ═══════════════════════════════════════════════════════════════════════
# 统一入口 · 按目标触发项目
#
# 识别约定：
#     <语言>/<项目>/index.<扩展名>
#
# 示例：
#     python/glados_checkin/index.py   →  Environment: python_glados_checkin
#     shell/backup/index.sh            →  Environment: shell_backup
#     php/report/index.php             →  Environment: php_report
#
# ── 选择要执行哪个项目 ────────────────────────────────────────────────
# 通过 workflow_dispatch 的 target 参数指定，以下写法都能匹配到
# python/glados_checkin 这一个项目（大小写、- / _ 差异都会被归一化）：
#     glados_checkin
#     glados-checkin
#     python_glados_checkin
#     python/glados_checkin
#     all（或留空）→ 执行全部
#
# ── 外部触发（curl / 调度器 / 中转服务）───────────────────────────────
#   POST https://api.github.com/repos/<owner>/<repo>/actions/workflows/run-python.yml/dispatches
#   Authorization: Bearer <PAT，需 Actions: Read and write>
#   Accept: application/vnd.github+json
#   Content-Type: application/json
#
#   {"ref":"main","inputs":{"target":"glados-checkin"}}
#
#   返回 204 即已受理。想直接拿到 run id，加 "return_run_details":true
#   并把 X-GitHub-Api-Version 换成 2026-03-10。
#
# ── 新增项目 ──────────────────────────────────────────────────────────
# 建目录写 index.<ext> → 建同名 Environment → 填 secrets，无需改动本文件。
# ═══════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      target:
        description: '要执行的项目：all / 项目名 / Environment 名（如 glados-checkin）'
        required: false
        default: 'all'
        type: string
  # cron 暂不启用（GitHub 的 schedule 实测不可靠，改由外部调度器打上面的 URL）
  # schedule:
  #   - cron: "7,22,37,52 * * * *"

concurrency:
  group: run-projects
  cancel-in-progress: false

jobs:
  # ═════════════════ 1. 扫描并按 target 过滤 ═════════════════
  discover:
    name: Discover projects
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      projects: ${{ steps.scan.outputs.projects }}
      count: ${{ steps.scan.outputs.count }}
      scope: ${{ steps.scan.outputs.scope }}
    steps:
      - uses: actions/checkout@v4

      - name: Scan and filter
        id: scan
        shell: bash
        env:
          # 用户输入经 env 传入，避免被直接拼接进 shell 脚本
          TARGET_RAW: ${{ inputs.target }}
        run: |
          set -euo pipefail

          # ── 归一化 target：转小写，非字母数字统一成下划线 ──
          target_raw="$TARGET_RAW"
          target_norm=$(printf '%s' "$target_raw" \
                        | tr 'A-Z' 'a-z' \
                        | sed -E 's/[^a-z0-9]+/_/g; s/^_+//; s/_+$//')

          # 支持的语言入口，新增语言时在这里补一条
          ENTRY_NAMES=(-name 'index.py' -o -name 'index.sh' -o -name 'index.php')

          # ── 全量扫描：深度正好为 3 的 ./<语言>/<项目>/index.<ext> ──
          all_projects=$(
            find . -mindepth 3 -maxdepth 3 -type f \
                 \( "${ENTRY_NAMES[@]}" \) \
                 -not -path './.git/*' \
              | sed 's|^\./||' | sort \
              | while read -r entry; do
                  [ -n "$entry" ] || continue
                  dir=$(dirname "$entry")
                  project=$(basename "$dir")
                  lang=$(basename "$(dirname "$dir")")
                  ext="${entry##*.}"

                  # match 字段预先算好归一化别名，供 target 比对
                  jq -n -c \
                    --arg lang    "$lang" \
                    --arg project "$project" \
                    --arg env     "${lang}_${project}" \
                    --arg entry   "$entry" \
                    --arg ext     "$ext" \
                    '{lang:$lang, project:$project, env:$env, entry:$entry, ext:$ext,
                      match: ([$env, $project]
                              | map(ascii_downcase
                                    | gsub("[^a-z0-9]+"; "_")
                                    | sub("^_+"; "") | sub("_+$"; ""))
                              | unique)}'
                done \
              | jq -s -c '.'
          )

          [ -n "$all_projects" ] || all_projects='[]'
          total=$(printf '%s' "$all_projects" | jq 'length')

          # ── 按 target 过滤；all / 留空 = 全量 ──
          if [ -z "$target_norm" ] || [ "$target_norm" = "all" ]; then
            selected="$all_projects"
            scope="all"
          else
            selected=$(printf '%s' "$all_projects" \
                       | jq -c --arg t "$target_norm" \
                            '[ .[] | select(.match | index($t)) ]')
            scope="$target_raw"
          fi

          count=$(printf '%s' "$selected" | jq 'length')

          # 指定了目标却一个都没匹配上 → 直接报错，避免静默跳过
          if [ "$count" -eq 0 ] && [ "$scope" != "all" ]; then
            available=$(printf '%s' "$all_projects" | jq -r '[.[].env] | join(", ")')
            echo "::error::未找到目标 '$target_raw'。可用目标：${available:-（仓库里还没有任何项目）}"
            exit 1
          fi

          echo "projects=$selected" >> "$GITHUB_OUTPUT"
          echo "count=$count"       >> "$GITHUB_OUTPUT"
          echo "scope=$scope"       >> "$GITHUB_OUTPUT"

          echo "范围: $scope | 命中 $count/$total 个项目"

          # ── 运行摘要：列出全部可用目标 + 本次选中 ──
          {
            echo "## 执行范围：\`$scope\`"
            echo ""
            echo "### 可用目标（共 $total 个）"
            echo ""
            if [ "$total" -eq 0 ]; then
              echo "仓库里还没有 \`<语言>/<项目>/index.<ext>\`。"
            else
              echo "| target 可填 | 语言 | Environment | 入口 |"
              echo "|---|---|---|---|"
              printf '%s' "$all_projects" \
                | jq -r '.[] | "| `\(.project)` | \(.lang) | `\(.env)` | `\(.entry)` |"'
            fi
            echo ""
            echo "### 本次选中（$count 个）"
            echo ""
            if [ "$count" -eq 0 ]; then
              echo "无"
            else
              echo "| Environment | 入口 |"
              echo "|---|---|"
              printf '%s' "$selected" | jq -r '.[] | "| `\(.env)` | `\(.entry)` |"'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ═════════════════ 2. 执行选中的项目 ═════════════════
  run:
    name: ${{ matrix.project.env }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        # 只展开被 target 命中的项目
        project: ${{ fromJSON(needs.discover.outputs.projects) }}
    runs-on: ubuntu-latest
    # 每个 job 挂到与自己项目同名的 Environment，实现 secrets 隔离
    environment:
      name: ${{ matrix.project.env }}
    permissions:
      contents: read
    env:
      # ─────────────────────────────────────────────────────────────────
      # 所有项目用到的 secret 统一在此声明。
      # ⚠️ 新增 secret 时，务必同时把名称加进下面的 SECRET_NAMES。
      #
      # 隔离原理：每个 job 挂的 Environment 不同，同名 secret 在各
      # Environment 里互相独立；本 Environment 未配置的会解析为空字符串。
      # ─────────────────────────────────────────────────────────────────
      GLADOS_COOKIES:         ${{ secrets.GLADOS_COOKIES }}
      GLADOS_EXCHANGE_PLAN:   ${{ secrets.GLADOS_EXCHANGE_PLAN }}
      GLADOS_VERBOSE:         ${{ secrets.GLADOS_VERBOSE }}
      PUSHDEER_SENDKEY:       ${{ secrets.PUSHDEER_SENDKEY }}

      # 指纹密钥：只用于生成 HMAC 指纹做比对，本身绝不打印
      COMMON_FINGERPRINT_KEY: ${{ secrets.COMMON_FINGERPRINT_KEY }}

      # 需要校验的 secret 名称，空格分隔
      SECRET_NAMES: "GLADOS_COOKIES GLADOS_EXCHANGE_PLAN GLADOS_VERBOSE PUSHDEER_SENDKEY"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        if: matrix.project.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup PHP
        if: matrix.project.lang == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          lang="${{ matrix.project.lang }}"
          project="${{ matrix.project.project }}"

          if [ "$lang" = "python" ]; then
            python -m pip install --upgrade pip >/dev/null
            # 公共依赖 → 项目独有依赖
            for f in "python/requirements.txt" "python/$project/requirements.txt"; do
              if [ -f "$f" ]; then
                echo "→ pip install -r $f"
                pip install -r "$f"
              fi
            done
          elif [ "$lang" = "php" ]; then
            if [ -f "php/$project/composer.json" ]; then
              echo "→ composer install ($project)"
              composer install --no-interaction --no-progress
            fi
          fi

          echo "依赖处理完成"

      # ─────────────────────────────────────────────────────────────
      # secrets 自检：只输出「是否为空 / 位数 / HMAC 指纹」
      #
      # 为什么不用 MD5：
      #   本仓库是公开仓库，Actions 日志任何人可读。裸 MD5 等于给出一个
      #   公开的验证预言机，可被离线枚举爆破；且 GitHub 的自动脱敏基于
      #   原值字符串匹配，对 MD5 完全失效。
      #   HMAC-SHA256 指纹带密钥，外部拿到日志也无法反推，但仍可稳定
      #   用于「同一 secret 在不同环境/不同运行之间是否一致」的比对。
      # ─────────────────────────────────────────────────────────────
      - name: Check secrets
        shell: bash
        run: |
          set -uo pipefail

          env_name="${{ matrix.project.env }}"

          echo "Environment : $env_name"
          echo
          printf '%-24s %-7s %-9s %s\n' "SECRET" "EMPTY" "LENGTH" "FINGERPRINT"
          printf '%-24s %-7s %-9s %s\n' \
                 "------------------------" "-------" "---------" "--------------------"

          {
            echo "### Secrets — \`$env_name\`"
            echo ""
            echo "| Secret | Empty | Length | Fingerprint |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          missing=0
          for name in $SECRET_NAMES; do
            value="${!name-}"

            if [ -z "$value" ]; then
              empty="yes"
              length="0"
              fp="-"
              missing=$((missing + 1))
            else
              empty="no"
              length="${#value}"
              if [ -n "${COMMON_FINGERPRINT_KEY:-}" ]; then
                fp=$(printf '%s' "$value" \
                     | openssl dgst -sha256 -hmac "$COMMON_FINGERPRINT_KEY" -r \
                     | cut -d' ' -f1 | cut -c1-12)
                [ -n "$fp" ] || fp="(err)"
              else
                fp="(skip: no key)"
              fi
            fi

            printf '%-24s %-7s %-9s %s\n' "$name" "$empty" "$length" "$fp"
            echo "| \`$name\` | $empty | $length | \`$fp\` |" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ "$missing" -gt 0 ]; then
            echo
            echo "::warning::$env_name 中有 $missing 个 secret 为空（可能未配置，也可能本项目用不到）"
          fi

      - name: Run
        shell: bash
        run: |
          set -euo pipefail

          entry="${{ matrix.project.entry }}"
          ext="${{ matrix.project.ext }}"

          workdir=$(dirname "$entry")
          base=$(basename "$entry")

          # 切到项目目录再执行，保证项目内的相对导入/相对路径正常工作
          cd "$workdir"

          echo "════════ 运行 $entry （工作目录: $workdir） ════════"

          case "$ext" in
            py)  python "$base" ;;
            sh)  bash   "$base" ;;
            php) php    "$base" ;;
            *)   echo "::error::不支持的入口类型: $entry" ; exit 1 ;;
          esac
