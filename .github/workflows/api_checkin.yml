name: api_checkin

# ═══════════════════════════════════════════════════════════════════════
# 项目：api_checkin
#
# 对应代码：python/api_checkin/index.py
# 对应环境：python_api_checkin
#
# 功能：new-api / one-api 站点每日签到。支持多站点、一个站点多账号，
#       每个账号用 cookie 或访问令牌认证。
#
# 触发方式：
#   1) 总入口派发：run-project.yml 传 project=api_checkin（⚠️ 总入口不能再传参数）
#   2) 直接调用 API：
#      POST /repos/<owner>/<repo>/actions/workflows/api_checkin.yml/dispatches
#      {"ref":"main","inputs":{"API_VERBOSE":"true"}}
#   3) Actions 页面手动 Run workflow —— 每个可覆盖项都是一个独立输入框
#
# ── 用 ref 传账号列表（SITES）──
# 直接把账号表填进 SITES（Actions 页面），或放进 inputs.SITES（API）：
#
#   {"ref":"main","inputs":{"SITES":"{\"https://<站点地址>\":{\"tokens\":[{\"token\":\"<令牌>\",\"user_id\":\"<用户ID>\"}]}}"}}
#
# ⚠️ input 的值永远是**字符串**，所以 SITES 那段 JSON 要转义一遍再嵌进 body（上面这样）。
#    整行必须在一行内写完：HTTP body 的 JSON 字符串内部不能出现真换行，
#    折行粘贴会被 GitHub 直接 400（本地用 jq 解析却会通过 —— jq 容忍裸换行）。
# ⚠️ 在 Actions 页面填时**不转义**，直接粘账号表即可。
#
# ⚠️⚠️ workflow_dispatch 的 inputs **不是机密，也不受脱敏保护**：
#     GitHub 会把它原样存进本次 run 的记录，`::add-mask::` 只遮日志、遮不住它。
#     本仓库是**公开**的，所以任何人打开 run 详情页都能看到你传的 cookie / 令牌。
#     → 只想图方便、不在乎这些免费站账号被人看到，可以用；
#     → 想保密就把账号表写进 Environment secret SITES。
#     通用层会自动告警：common/report-inputs.sh 发现被 ref 传入的项里有登记在
#     SECRET_NAMES 的，就打一条 ::warning::（业务脚本不参与这个判断）。
#
# 配置来源优先级（高 → 低）：
#     ref（同名 input）  >  vars / secrets（本文件的 env:）  >  <项目目录>/.env
# 前两层都在下面的 env: 里完成，每个键一行：
#     KEY: ${{ inputs.KEY || vars.KEY }}        # 机密项写 secrets.KEY
# 空字符串视为「没传」，所以留空会自动回落到仓库配置。.env 是最低优先级，
# 由 Python 侧在运行期读取（python/common/dotenv.py），不在 workflow 里体现。
# 被传入 / 被补入的项都只在日志与 Job Summary 里列**名字和长度**，不回显值。
#
# ⚠️ 「没传参」却没有回落到仓库配置时，先查这两处：`||` 右边写的是不是 vars/secrets
#    （写错来源会静默解析成空字符串），以及 GitHub 上那个 Variable 是不是真的建了。
#
# 通用逻辑全部在 common/*.sh，本文件只做「声明」：
#   common/install-deps.sh     依赖安装（按 LANG_NAME 分支）
#   common/report-inputs.sh    报告本次 ref 传了哪些项 + 机密项告警（没传则跳过）
#   common/check-secrets.sh    配置自检（默认跳过；DEBUG_MODE 开启时输出明文 + HMAC 指纹）
#   common/execute.sh          按 ENTRY 扩展名执行
#
# 新增同类项目：复制本文件，改 name / environment.name / env / ENTRY 四处。
# ═══════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    # 每个可覆盖项一个输入框，留空 = 用仓库里配的 vars / secrets。
    # ⚠️ input 不是机密：传了就等于公开（公开仓库的 run 详情页人人可见），
    #    带凭证的项（SITES / PUSHDEER_SENDKEY）请谨慎使用。
    inputs:
      SITES:
        description: '站点账号表（JSON，格式见 README）。⚠️ 传入=公开，含凭证时慎用'
        required: false
        default: ''
        type: string
      PUSHDEER_SENDKEY:
        description: 'PushDeer 推送密钥。⚠️ 传入=公开'
        required: false
        default: ''
        type: string
      API_VERBOSE:
        description: '输出详细日志：true / false（留空 = 用仓库配置）'
        required: false
        default: ''
        type: string
      API_TIMEOUT:
        description: '单次请求超时秒数（留空 = 用仓库配置）'
        required: false
        default: ''
        type: string

concurrency:
  group: api_checkin
  cancel-in-progress: false

jobs:
  run:
    name: api_checkin
    runs-on: ubuntu-latest
    # 挂到本项目专属的 Environment，secrets 与其他项目隔离
    environment:
      name: python_api_checkin
    permissions:
      contents: read
    env:
      # ── 传给 common/*.sh 的通用参数 ──
      ENV_NAME:  python_api_checkin
      LANG_NAME: python
      PROJECT:   api_checkin
      ENTRY:     python/api_checkin/index.py

      # ── 配置来源：同名 input 优先，留空自动回落到 vars / secrets ──
      #    `||` 左边为空（没传参）就取右边。写错来源（该用 vars 却写了 secrets）
      #    会静默解析成空字符串，代码里有默认值兜底，所以不报错但配置不生效。
      #
      #    SITES：站点账号表，格式见 python/api_checkin/README.md。
      #    ⚠️ 老 one-api / 部分 fork 的 sk- 只是模型调用 key，不能当用户令牌，
      #       那类站点请用 cookie 认证。
      SITES:                  ${{ inputs.SITES || secrets.SITES }}
      PUSHDEER_SENDKEY:       ${{ inputs.PUSHDEER_SENDKEY || secrets.PUSHDEER_SENDKEY }}
      API_VERBOSE:            ${{ inputs.API_VERBOSE || vars.API_VERBOSE }}
      API_TIMEOUT:            ${{ inputs.API_TIMEOUT || vars.API_TIMEOUT }}

      # ── 本次 ref 传了哪些项 ──
      #    只给 common/report-inputs.sh 用：报告名称 + 长度、给机密项打 ::warning::。
      #    它读**原始 inputs**，而不是上面回落后的值 —— 否则分不清「传了」和「没传」。
      REF_INPUTS:             ${{ toJSON(inputs) }}

      # ── 指纹密钥：仓库级 secret，只供 check-secrets.sh 生成 HMAC 指纹，本身绝不打印 ──
      COMMON_FINGERPRINT_KEY: ${{ secrets.COMMON_FINGERPRINT_KEY }}

      # ── 配置自检的调试开关（两级，Environment 覆盖仓库级）──
      # 默认【整体跳过】自检；只有这里为真值时才执行，并输出明文便于排查。
      #   DEBUG_MODE          当前 Environment 的开关：只调试本项目时设它
      #   COMMON_DEBUG_MODE   仓库级全局开关：所有项目一起打开
      # 未设置 → 展开为空字符串 → 脚本按「回落到另一级 / 跳过」处理。
      # ⚠️ 这两行必须存在：脚本只认进程环境变量，GitHub 上的 Variables 靠这两行桥接，
      #    漏了就会出现「在 GitHub 设了开关但没生效」。
      DEBUG_MODE:        ${{ vars.DEBUG_MODE }}
      COMMON_DEBUG_MODE: ${{ vars.COMMON_DEBUG_MODE }}

      # 需要自检的名称，空格分隔（仅在调试开关开启时才会被读取与输出）。
      #   SECRET_NAMES   → 只输出 HMAC 指纹（值不可见，永不打印明文）
      #   VARIABLE_NAMES → 输出明文值
      # ⚠️ 必须写**进程里真实存在的变量名**（就是上面 env: 里那几行的键名）。
      # 这份清单同时给 report-inputs.sh 用：在里面且被 ref 传入的项会打 ::warning::
      SECRET_NAMES:   "SITES PUSHDEER_SENDKEY"
      VARIABLE_NAMES: "API_VERBOSE API_TIMEOUT"

    steps:
      - uses: actions/checkout@v4

      # 报告本次通过 ref 传了哪些项（只列名称和长度）、给机密项打 ::warning::。
      # 注意：**值的生效不靠这一步** —— 靠上面 env: 里的 `inputs.X || secrets.X`。
      - name: Report ref inputs
        run: bash common/report-inputs.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: bash common/install-deps.sh

      - name: Check secrets
        run: bash common/check-secrets.sh

      - name: Run
        run: bash common/execute.sh

      # 把 Run 的输出重新渲染到 Job Summary。
      # if: always()：即使 Run 失败，也要把已产生的输出带出来
      - name: Job Summary
        if: always()
        env:
          SUMMARY_TITLE: API 签到
        run: bash common/render-summary.sh
