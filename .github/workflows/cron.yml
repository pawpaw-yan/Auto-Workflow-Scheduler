name: Hello Cron

on:
  # 每 15 分钟执行一次，即每小时的 0、15、30、45 分
  # 注意：GitHub cron 使用 UTC 时间。北京时间 = UTC+8，整点偏移不改变分钟位，
  # 所以 */15 在 UTC 和北京时间下都是每小时的 0/15/30/45 分
  schedule:
    - cron: "*/15 * * * *"
  # 允许在 Actions 页面手动触发，方便调试
  workflow_dispatch:

# 同一时间只保留一个运行中的任务，避免排队堆积
concurrency:
  group: hello-cron
  cancel-in-progress: false

jobs:
  hello:
    name: Echo Hello Cron
    runs-on: ubuntu-latest
    # 默认权限最小化，按需在具体步骤中提升
    permissions:
      contents: read
    steps:
      - name: Run echo
        run: echo "Hello Cron!"
